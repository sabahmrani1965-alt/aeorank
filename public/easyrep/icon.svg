    <rect x="48.5" y="25.5" width="6" height="13" rx="3" fill="#DCE7FB"/>
    <rect x="23" y="28.5" width="18" height="7" rx="3.5" fill="#fff"/>
    <rect x="17" y="21" width="8" height="22" rx="4" fill="#fff"/>
    <rect x="39" y="21" width="8" height="22" rx="4" fill="#fff"/>
